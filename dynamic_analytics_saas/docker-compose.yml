# ==============================================================================
# Ragada Analytics - Enterprise Production Docker Compose Configuration
# Features: Hardened Security, Localhost Port Isolation, Resource Limits, Healthchecks
# ==============================================================================
services:
  db:
    image: postgres:15-alpine
    container_name: ragada-analytics-db
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-saas_db}
    # Security: Zero-Trust Network Isolation (Accessible only within Docker bridge network)
    expose:
      - "5432"
    volumes:
      - saas_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-saas_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: ragada-analytics-redis
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    # Security: Zero-Trust Network Isolation (Accessible only within Docker bridge network)
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build: 
      context: .
      dockerfile: backend_api/Dockerfile
    container_name: ragada-analytics-backend
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    ports:
      - "${HOST_BACKEND_PORT:-8001}:8001"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://user:password@db:5432/saas_db}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      - SECRET_KEY=${SECRET_KEY:-local_dev_secret_key_ragada_analytics_2026_secured}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173,http://localhost:5174,http://localhost:80,http://127.0.0.1:5174}
    volumes:
      - shared_tmp:/shared_tmp
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1536M
        reservations:
          memory: 384M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    command: uvicorn main:app --host 0.0.0.0 --port 8001

  celery_worker:
    build:
      context: .
      dockerfile: backend_api/Dockerfile
    container_name: ragada-analytics-worker
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://user:password@db:5432/saas_db}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
    volumes:
      - shared_tmp:/shared_tmp
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A worker.celery_app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1536M
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    command: celery -A worker.celery_app worker --loglevel=info

  frontend:
    build:
      context: ./frontend_app
      dockerfile: Dockerfile
    container_name: ragada-analytics-frontend
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    # Single Public Entrypoint Port (Served by Nginx Alpine with Rate Limiting)
    ports:
      - "${HOST_FRONTEND_PORT:-5174}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:80/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  saas_pgdata:
  shared_tmp:
