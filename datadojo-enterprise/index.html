<!DOCTYPE html>
<html lang="id">
<head>

  <title>DataDojo Enterprise — Commercial Data Analyst Assessment & Curriculum Platform</title>
  
  <!-- Fonts: Hanken Grotesk (Display) & JetBrains Mono (Primary Body / Execution) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;600;700;800&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <!-- CodeMirror Editor CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/sql/sql.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>

  <!-- sql.js (SQLite WebAssembly) CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>

  <!-- Stylesheet (Enterprise v12) -->
  <link rel="stylesheet" href="css/style.css?v=12">
</head>
<body>
  <!-- Confetti Canvas -->
  <canvas id="confetti"></canvas>

  <div class="app-layout">

    <aside class="sidebar">
      <nav class="nav-menu">
        <span class="nav-section-title">Workspace</span>
        <a href="#/dashboard" class="nav-link" data-section="dashboard">
          <span class="nav-icon">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
          </span>
          <span class="nav-label">Executive Overview</span>
        </a>

        <span class="nav-section-title">Curriculum Labs</span>
        <a href="#/sql" class="nav-link active" data-section="sql">
          <span class="nav-icon">&gt;_</span>
          <span class="nav-label">SQL Curriculum</span>
          <span class="nav-meta-badge">4 BAB</span>
        </a>
        <a href="#/python" class="nav-link" data-section="python">
          <span class="nav-icon">&lt;/&gt;</span>
          <span class="nav-label">Python &amp; pandas</span>
          <span class="nav-meta-badge">4 BAB</span>
        </a>

        <span class="nav-section-title">Assessment Suite</span>
        <a href="#/quiz" class="nav-link" data-section="quiz">

          <span class="nav-label">Power BI &amp; DAX</span>
          <span class="nav-meta-badge">4 BAB</span>
        </a>
        <a href="#/interview" class="nav-link" data-section="interview">
          <span class="nav-icon">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>

          <span class="nav-meta-badge">4 BAB</span>
        </a>
        <a href="#/mock" class="nav-link" data-section="mock">
          <span class="nav-icon">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
          </span>
          <span class="nav-label">Timed Assessment</span>
          <span class="nav-pro-tag" id="navMockTag">PRO</span>
        </a>

        <a href="#/pricing" class="nav-link" data-section="pricing">
          <span class="nav-icon">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect><line x1="1" y1="10" x2="23" y2="10"></line></svg>
          </span>
          <span class="nav-label">Membership &amp; Plans</span>
        </a>
        <a href="#/leaderboard" class="nav-link" data-section="leaderboard">
          <span class="nav-icon">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline><polyline points="17 6 23 6 23 12"></polyline></svg>

          <span class="nav-label">Global Benchmark</span>

          <span class="nav-icon">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>

        <div class="sidebar-plan-box" id="sidebarPlanBox"></div>

    <main class="view-container" id="view"></main>

  <!-- Floating Toast Notifications -->
  <div id="toasts"></div>

  <!-- Modal / Dialog Root -->
  <div id="modal-root"></div>

  <!-- Application Logic Scripts (Strict Load Order) -->
  <script src="js/data/sql-challenges.js"></script>
  <script src="js/data/python-challenges.js"></script>
  <script src="js/data/quiz-bank.js"></script>
  <script src="js/data/interview-cards.js"></script>
  <script src="js/engines/sql-engine.js"></script>
  <script src="js/engines/python-engine.js"></script>
  <script src="js/state.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>

</html>
