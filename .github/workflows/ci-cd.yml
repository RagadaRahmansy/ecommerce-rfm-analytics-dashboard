name: CI/CD Pipeline - Ragada Analytics

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  security-audit:
    name: 🛡️ Security & Leak Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Leak Prevention (.gitignore compliance)
        run: |
          echo "Scanning tracked git files for sensitive files or datasets..."
          LEAKED_FILES=$(git ls-files | grep -E '(\.env$|\.env\.local$|dataset.*\.csv$|test_data.*\.csv$|\.key$|\.pem$)' || true)
          if [ -n "$LEAKED_FILES" ]; then
            echo "::error::CRITICAL SECURITY ALERT: Leaked sensitive file detected in git:"
            echo "$LEAKED_FILES"
            exit 1
          fi
          echo "✅ Clean! Zero credentials or sensitive CSV datasets tracked in Git."

  backend-quality:
    name: 🐍 Backend Lint & Automated Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./dynamic_analytics_saas/backend_api
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: ./dynamic_analytics_saas/backend_api/requirements.txt

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov flake8

      - name: Syntax & Lint Inspection
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Pytest Test Suite
        env:
          DATABASE_URL: sqlite:///./test_saas.sqlite
          SECRET_KEY: ci_cd_test_secret_key_ragada_analytics_2026
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/0
        run: |
          pytest test_main.py -v --tb=short

  frontend-quality:
    name: ⚡ Frontend Build & Bundle Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./dynamic_analytics_saas/frontend_app
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'
          cache-dependency-path: ./dynamic_analytics_saas/frontend_app/package-lock.json

      - name: Clean Install NPM Dependencies
        run: npm ci

      - name: Verify Production Vite Build
        run: npm run build

  docker-verification:
    name: 🐳 Docker Multi-Stage Build Check
    runs-on: ubuntu-latest
    needs: [backend-quality, frontend-quality]
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Hardened Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./dynamic_analytics_saas
          file: ./dynamic_analytics_saas/backend_api/Dockerfile
          push: false
          tags: ragada-analytics-backend:ci-test

      - name: Build Multi-Stage Nginx Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./dynamic_analytics_saas/frontend_app
          file: ./dynamic_analytics_saas/frontend_app/Dockerfile
          push: false
          tags: ragada-analytics-frontend:ci-test
